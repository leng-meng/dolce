name: Preview Dolce on Pages

on:
  push:
    branches:
      - feat/verse-progress
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build web app
        run: npm run build
        env:
          BASE_PATH: /dolce/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
